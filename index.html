<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des étudiants ISESOD</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-wrapper">
                <div class="logo-titles"><span class="acronyme">ISESOD GOMA</span></div>
            </div>
            <div class="nav-links">
                <button onclick="showSection('config')" id="btn-config" class="nav-item active">Configuration</button>
                <button onclick="showSection('inscription')" id="btn-inscription" class="nav-item">Inscriptions</button>
                <button onclick="showSection('admin')" id="btn-admin" class="nav-item">Gestion Points</button>
                <button onclick="showSection('student-view')" id="btn-student" class="nav-item">Espace Étudiant</button>
            </div>
        </div>
    </nav>
    
    <main class="content-area">
        <!-- CONFIGURATION -->
        <div id="config" class="section active">
            <div class="layout config-grid">
                <div class="config-card">
                    <h3>GESTION DES PROMOTIONS</h3>
                    <input type="text" id="newPromoInputName" placeholder="Ex: L1 Informatique">
                    <button onclick="ajouterPromotion()">Créer la Promotion</button>
                    <ul id="listPromosDisplay" class="debug-list"></ul>
                </div>
                <div class="config-card">
                    <h3>CRÉATION DES COURS</h3>
                    <input type="text" id="newCourseInput" placeholder="Nom du cours...">
                    <input type="text" id="newProfInput" placeholder="Nom du Professeur">
                    <select id="selectPromoForCourse"></select>
                    <button onclick="ajouterCours()">Enregistrer le Cours</button>
                </div>
            </div>
        </div>

        <!-- INSCRIPTION -->
        <div id="inscription" class="section">
            <div class="layout admin-layout">
                <div class="left-panel">
                    <h3>REGISTRE GÉNÉRAL</h3>
                    <table>
                        <thead><tr><th>ID</th><th>Nom</th><th>Classe</th><th>Actions</th></tr></thead>
                        <tbody id="listInscritsTable"></tbody>
                    </table>
                </div>
                <div class="right-panel">
                    <div class="config-card">
                        <h3>NOUVELLE INSCRIPTION</h3>
                        <input type="text" id="newStudentName" placeholder="Nom de l'étudiant...">
                        <select id="selectPromoForStudent"></select>
                        <button onclick="inscrireEtudiant()">Inscrire</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- GESTION POINTS -->
        <div id="admin" class="section">
            <div class="layout admin-layout">
                <div class="left-panel">
                    <table>
                        <thead><tr><th>ID Note</th><th>Étudiant</th><th>Cours</th><th>Note/100</th></tr></thead>
                        <tbody id="mainPointsTable"></tbody>
                    </table>
                </div>
                <div class="right-panel">
                    <form id="pointsForm">
                        <h3>SAISIE DES NOTES</h3>
                        <select id="selectStudent" onchange="filtrerCoursParPromo()"><option value="">-- Étudiant --</option></select>
                        <select id="selectCourse" disabled><option value="">-- Cours --</option></select>
                        <input type="number" id="pointsInput" placeholder="Note" min="0" max="100">
                        <button type="submit">Valider</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ESPACE ETUDIANT -->
        <div id="student-view" class="section">
            <div class="layout student-layout">
                <div class="left-panel">
                    <h2>MON RELEVÉ</h2>
                    <select id="studentSelectView" onchange="calculerBulletin()"><option value="">-- Qui êtes-vous ? --</option></select>
                    <div id="studentInfoBanner" class="info-banner"></div>
                    <table>
                        <thead><tr><th>Cours</th><th>Note</th><th>Statut</th></tr></thead>
                        <tbody id="bulletinBody"></tbody>
                    </table>
                </div>
                <div class="right-panel average-card">
                    <h3>MOYENNE</h3>
                    <div id="moyenneDisplay" class="big-score">0%</div>
                </div>
            </div>
        </div>
    </main>

    <!-- LIEN SÉCURISÉ GLOBAL INTÉGRAL AVEC HTTPS -->
    <script src="jsdelivr.net"></script>
    <script src="script.js"></script>
</body>
</html>
